<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaFund Trader Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#07111f;
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:520px;
  margin:auto;
  padding:22px;
}

.logo{
  text-align:center;
  color:#46e6a5;
  font-size:30px;
  font-weight:800;
  margin:20px 0;
}

.card{
  background:#0d1a2b;
  border:1px solid #29415d;
  border-radius:16px;
  padding:20px;
  margin-top:16px;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:8px;
  border:1px solid #29415d;
  background:#091625;
  color:#fff;
}

button{
  width:100%;
  padding:13px;
  margin-top:9px;
  border:0;
  border-radius:8px;
  background:#46e6a5;
  color:#061018;
  font-weight:bold;
  cursor:pointer;
}

.secondary{
  background:#20354d;
  color:#fff;
}

.danger{
  background:#572735;
  color:#fff;
}

.hidden{
  display:none;
}

.msg{
  margin-top:12px;
  color:#aebed0;
  line-height:1.5;
}

.email{
  color:#aebed0;
  font-size:14px;
  word-break:break-all;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#102034;
  border-radius:12px;
  padding:15px;
}

.big{
  font-size:23px;
  font-weight:bold;
  margin-top:6px;
}

.green{
  color:#46e6a5;
}

.red{
  color:#ff6262;
}

.trade{
  background:#102034;
  border-radius:10px;
  padding:13px;
  margin:8px 0;
}

.badge{
  display:inline-block;
  background:#14382f;
  color:#65efb5;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
}

.small{
  color:#8fa4b9;
  font-size:12px;
}
</style>
</head>

<body>

<div class="wrap">

<div class="logo">NovaFund</div>

<!-- AUTH -->

<div id="auth" class="card">

<h2>Trader Account</h2>

<input
  id="email"
  type="email"
  placeholder="Email address"
>

<input
  id="password"
  type="password"
  placeholder="Password"
>

<button onclick="login()">Login</button>

<button class="secondary" onclick="signup()">
Create Account
</button>

<div id="authMsg" class="msg"></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="hidden">

<span class="badge">TRADER ACCOUNT</span>

<h2>Trader Dashboard</h2>

<div id="userEmail" class="email"></div>

<p>Account: <b>$5,000 Challenge</b></p>


<!-- STATS -->

<div class="grid">

<div class="stat">
Balance
<div id="balance" class="big">$5,000</div>
</div>

<div class="stat">
Equity
<div id="equity" class="big">$5,000</div>
</div>

<div class="stat">
Profit
<div id="profit" class="big green">+$0</div>
</div>

<div class="stat">
Profit Target
<div id="target" class="big">8%</div>
</div>

<div class="stat">
Daily Loss
<div id="dailyLoss" class="big">0%</div>
</div>

<div class="stat">
Max Drawdown
<div id="drawdown" class="big">0%</div>
</div>

</div>


<!-- ADD TRADE -->

<div class="card">

<h3>➕ Add Trade</h3>

<select id="symbol">
<option value="XAUUSD">XAUUSD</option>
<option value="EURUSD">EURUSD</option>
<option value="GBPUSD">GBPUSD</option>
<option value="USDJPY">USDJPY</option>
<option value="BTCUSD">BTCUSD</option>
</select>

<select id="side">
<option value="BUY">BUY</option>
<option value="SELL">SELL</option>
</select>

<input
  id="entry"
  type="number"
  step="any"
  placeholder="Entry Price"
>

<input
  id="exit"
  type="number"
  step="any"
  placeholder="Exit Price"
>

<input
  id="quantity"
  type="number"
  step="any"
  placeholder="Quantity / Lot"
  value="1"
>

<select id="resultType">
<option value="auto">Calculate automatically</option>
<option value="profit">Manual Profit</option>
<option value="loss">Manual Loss</option>
</select>

<input
  id="manualPL"
  type="number"
  step="any"
  placeholder="Manual P/L ($)"
  style="display:none"
>

<button onclick="addTrade()">
Save Trade
</button>

<div id="tradeMsg" class="msg"></div>

</div>


<!-- RECENT TRADES -->

<div class="card">

<h3>Recent Trades</h3>

<div id="trades">
No trades yet.
</div>

</div>


<button class="danger" onclick="logout()">
Logout
</button>

</div>

</div>


<script type="module">

import {createClient}
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://fbtltoldqbegahrhrhzv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_gEWtMDiKIs03V-DeSMy0Kg_GyB73tt5";

const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   ELEMENTS
========================= */

const auth =
document.getElementById("auth");

const dashboard =
document.getElementById("dashboard");

const authMsg =
document.getElementById("authMsg");

const tradeMsg =
document.getElementById("tradeMsg");

let currentUser = null;


/* =========================
   LOGIN
========================= */

window.login = async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!email || !password){

authMsg.innerText =
"Email aur password bharo.";

return;

}

authMsg.innerText =
"Login ho raha hai...";


const {data,error} =
await supabase.auth.signInWithPassword({

email,
password

});


if(error){

authMsg.innerText =
error.message;

return;

}

currentUser =
data.user;

await showDashboard();

};


/* =========================
   SIGNUP
========================= */

window.signup = async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!email || !password){

authMsg.innerText =
"Email aur password bharo.";

return;

}

if(password.length < 6){

authMsg.innerText =
"Password minimum 6 characters hona chahiye.";

return;

}

authMsg.innerText =
"Account create ho raha hai...";


const {data,error} =
await supabase.auth.signUp({

email,
password,

options:{
emailRedirectTo:
"https://sumitchenurvar-cell.github.io/NOVAFUND/"
}

});


if(error){

authMsg.innerText =
error.message;

return;

}


if(data.session){

currentUser =
data.user;

await showDashboard();

}else{

authMsg.innerText =
"Account created! Email confirm karke Login karo.";

}

};


/* =========================
   SHOW DASHBOARD
========================= */

async function showDashboard(){

auth.classList.add("hidden");

dashboard.classList.remove("hidden");

document.getElementById("userEmail").innerText =
currentUser.email;

await loadAccount();

await loadTrades();

}


/* =========================
   ACCOUNT
========================= */

async function loadAccount(){

let {data,error} =
await supabase
.from("trader_accounts")
.select("*")
.eq("user_id",currentUser.id)
.maybeSingle();


if(error){

tradeMsg.innerText =
error.message;

return;

}


/* Create account if missing */

if(!data){

const newAccount = {

user_id:currentUser.id,

account_size:5000,

balance:5000,

equity:5000,

profit:0,

profit_target:8,

daily_loss:0,

max_drawdown:0

};


const result =
await supabase
.from("trader_accounts")
.insert(newAccount)
.select()
.single();


if(result.error){

tradeMsg.innerText =
result.error.message;

return;

}

data =
result.data;

}


updateDashboard(data);

}


/* =========================
   UPDATE DASHBOARD
========================= */

function updateDashboard(data){

document.getElementById("balance").innerText =
"$" +
Number(data.balance).toLocaleString(
"en-US",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

document.getElementById("equity").innerText =
"$" +
Number(data.equity).toLocaleString(
"en-US",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

const profit =
Number(data.profit);

const profitElement =
document.getElementById("profit");

profitElement.innerText =
(profit >= 0 ? "+$" : "-$")
+
Math.abs(profit).toLocaleString(
"en-US",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

profitElement.className =
"big " +
(profit >= 0 ? "green" : "red");

document.getElementById("target").innerText =
Number(data.profit_target) + "%";

document.getElementById("dailyLoss").innerText =
Number(data.daily_loss) + "%";

document.getElementById("drawdown").innerText =
Number(data.max_drawdown) + "%";

}


/* =========================
   RESULT TYPE
========================= */

document
.getElementById("resultType")
.addEventListener(
"change",
function(){

const manual =
document.getElementById("manualPL");

if(this.value === "auto"){

manual.style.display =
"none";

}else{

manual.style.display =
"block";

}

});


/* =========================
   CALCULATE P/L
========================= */

function calculatePL(){

const type =
document.getElementById("resultType").value;

if(type !== "auto"){

const amount =
Number(
document.getElementById("manualPL").value
);

if(!amount || amount <= 0){

return null;

}

return type === "profit"
? amount
: -amount;

}


const side =
document.getElementById("side").value;

const entry =
Number(
document.getElementById("entry").value
);

const exit =
Number(
document.getElementById("exit").value
);

const quantity =
Number(
document.getElementById("quantity").value
);


if(!entry || !exit || !quantity){

return null;

}


/*
 Simple demo P/L calculation.

 BUY:
 Exit - Entry

 SELL:
 Entry - Exit

 This is NOT broker-specific tick/contract
 calculation.
*/

let difference;

if(side === "BUY"){

difference =
exit - entry;

}else{

difference =
entry - exit;

}


/*
 Demo multiplier.

 It keeps the dashboard easy to test.
 Real broker contract specifications
 are different.
*/

const multiplier = 100;

return difference *
quantity *
multiplier;

}


/* =========================
   ADD TRADE
========================= */

window.addTrade = async function(){

tradeMsg.innerText =
"Trade save ho raha hai...";


const symbol =
document.getElementById("symbol").value;

const side =
document.getElementById("side").value;


const entry =
Number(
document.getElementById("entry").value
);

const exit =
Number(
document.getElementById("exit").value
);

const quantity =
Number(
document.getElementById("quantity").value
);


const pl =
calculatePL();


if(pl === null){

tradeMsg.innerText =
"Trade details complete bharo.";

return;

}


const {data:account,error:accountError} =
await supabase
.from("trader_accounts")
.select("*")
.eq("user_id",currentUser.id)
.single();


if(accountError){

tradeMsg.innerText =
accountError.message;

return;

}


const oldBalance =
Number(account.balance);

const newBalance =
oldBalance + pl;


/* Equity equals balance in this demo
   after trade is closed */

const newEquity =
newBalance;

const newProfit =
Number(account.profit) + pl;


/* Drawdown */

let drawdown = 0;

if(newProfit < 0){

drawdown =
Math.abs(newProfit) /
Number(account.account_size) *
100;

}


/* Daily loss only when current trade is loss */

let dailyLoss =
Number(account.daily_loss);

if(pl < 0){

dailyLoss =
dailyLoss +
Math.abs(pl) /
Number(account.account_size) *
100;

}


const {error:updateError} =
await supabase
.from("trader_accounts")
.update({

balance:newBalance,

equity:newEquity,

profit:newProfit,

daily_loss:dailyLoss,

max_drawdown:drawdown

})
.eq("user_id",currentUser.id);


if(updateError){

tradeMsg.innerText =
updateError.message;

return;

}


/* Save trade */

const {error:tradeError} =
await supabase
.from("trader_trades")
.insert({

user_id:currentUser.id,

symbol:symbol,

side:side,

entry_price:entry,

exit_price:exit,

quantity:quantity,

profit_loss:pl

});


if(tradeError){

tradeMsg.innerText =
tradeError.message;

return;

}


tradeMsg.innerText =
"Trade successfully saved!";


/* Clear inputs */

document.getElementById("entry").value =
"";

document.getElementById("exit").value =
"";

document.getElementById("manualPL").value =
"";


await loadAccount();

await loadTrades();

};


/* =========================
   LOAD TRADES
========================= */

async function loadTrades(){

const {data,error} =
await supabase
.from("trader_trades")
.select("*")
.eq("user_id",currentUser.id)
.order("created_at",{ascending:false})
.limit(20);


if(error){

document.getElementById("trades").innerText =
error.message;

return;

}


const container =
document.getElementById("trades");


if(!data || data.length === 0){

container.innerText =
"No trades yet.";

return;

}


container.innerHTML =
"";


data.forEach(trade => {

const div =
document.createElement("div");

div.className =
"trade";


const pl =
Number(trade.profit_loss);

const color =
pl >= 0
? "green"
: "red";

const sign =
pl >= 0
? "+$"
: "-$";


div.innerHTML =

"<b>" +
trade.symbol +
"</b> — " +
trade.side +

"<br>" +

"<span class='" +
color +
"'>" +
sign +
Math.abs(pl).toFixed(2) +
"</span>" +

"<div class='small'>" +

"Entry: " +
trade.entry_price +

" | Exit: " +
trade.exit_price +

" | Qty: " +
trade.quantity +

"</div>";

container.appendChild(div);

});

}


/* =========================
   LOGOUT
========================= */

window.logout = async function(){

await supabase.auth.signOut();

currentUser =
null;

dashboard.classList.add("hidden");

auth.classList.remove("hidden");

authMsg.innerText =
"Logout successful.";

};


/* =========================
   EXISTING SESSION
========================= */

const {
data:{session}
} =
await supabase.auth.getSession();


if(session){

currentUser =
session.user;

await showDashboard();

}


supabase.auth.onAuthStateChange(
async (event,session)=>{

if(session && !currentUser){

currentUser =
session.user;

await showDashboard();

}

});

</script>

</body>
</html>
