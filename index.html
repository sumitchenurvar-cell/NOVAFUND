<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaFund | Login</title>
<style>
body{margin:0;background:#07111f;color:white;font-family:Arial}
.wrap{max-width:420px;margin:70px auto;padding:20px}
.logo{font-size:30px;font-weight:bold;color:#46e6a5;text-align:center}
.card{background:#0d1a2b;border:1px solid #29415d;border-radius:16px;padding:25px;margin-top:25px}
input{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;background:#091625;color:white;border:1px solid #29415d;border-radius:8px}
button{width:100%;padding:13px;margin-top:8px;border:0;border-radius:8px;background:#46e6a5;color:#061018;font-weight:bold}
.secondary{background:#20354d;color:white}
#dashboard{display:none}
.green{color:#46e6a5}
.stat{background:#0d1a2b;border:1px solid #29415d;border-radius:12px;padding:18px;margin:10px 0}
.big{font-size:25px;font-weight:bold}
.msg{margin-top:12px;color:#9eafc4}
</style>
</head>

<body>

<div class="wrap">
<div class="logo">NovaFund</div>

<div id="auth" class="card">
<h2 id="title">Create Trader Account</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="signup()">Create Account</button>
<button class="secondary" onclick="login()">Login</button>

<div id="msg" class="msg"></div>
</div>

<div id="dashboard">
<h2>Trader Dashboard</h2>
<p>Account: <b>$5,000 Challenge</b></p>

<div class="stat">
Balance
<div class="big">$5,000</div>
</div>

<div class="stat">
Profit
<div class="big green">$0</div>
</div>

<div class="stat">
Daily Loss
<div class="big">0%</div>
</div>

<div class="stat">
Max Drawdown
<div class="big">0%</div>
</div>

<button onclick="logout()">Logout</button>
</div>
</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
"https://fbtltoldqbegahrhrhzv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gEWtMDiKIs03V-DeSMy0Kg_GyB73tt5";

const supabase = createClient(
SUPABASE_URL,
SUPABASE_KEY
);

window.signup = async function(){

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

if(!email || !password){
document.getElementById("msg").innerText="Email aur password bharo.";
return;
}

const {error}=await supabase.auth.signUp({
email:email,
password:password
});

if(error){
document.getElementById("msg").innerText=error.message;
}else{
document.getElementById("msg").innerText=
"Account created! Email verify karke Login karo.";
}
};

window.login = async function(){

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

const {error}=await supabase.auth.signInWithPassword({
email:email,
password:password
});

if(error){
document.getElementById("msg").innerText=error.message;
}else{
showDashboard();
}
};

window.logout = async function(){

await supabase.auth.signOut();

document.getElementById("dashboard").style.display="none";
document.getElementById("auth").style.display="block";
};

function showDashboard(){

document.getElementById("auth").style.display="none";
document.getElementById("dashboard").style.display="block";

}

const {data:{session}} =
await supabase.auth.getSession();

if(session){
showDashboard();
}

</script>

</body>
</html>
