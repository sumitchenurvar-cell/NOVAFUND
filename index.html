<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaFund</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:480px;margin:auto;padding:25px}
.logo{text-align:center;color:#46e6a5;font-size:30px;font-weight:800;margin:25px 0}
.card{background:#0d1a2b;border:1px solid #29415d;border-radius:16px;padding:22px;margin-top:18px}
input{width:100%;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #29415d;background:#091625;color:#fff}
.passwordBox{position:relative}
.passwordBox input{padding-right:55px}
.eye{position:absolute;right:8px;top:8px;width:42px;padding:10px;background:#20354d;color:#fff}
button{width:100%;padding:13px;margin-top:9px;border:0;border-radius:8px;background:#46e6a5;color:#061018;font-weight:bold;cursor:pointer}
.secondary{background:#20354d;color:#fff}
.hidden{display:none}
.msg{margin-top:14px;color:#aebed0;line-height:1.5}
.stat{background:#102034;border-radius:12px;padding:16px;margin:10px 0}
.big{font-size:26px;font-weight:bold;margin-top:6px}
.green{color:#46e6a5}
.red{color:#ff6262}
.badge{display:inline-block;background:#14382f;color:#65efb5;padding:6px 10px;border-radius:20px;font-size:12px}
.link{background:none;color:#46e6a5;padding:5px;text-decoration:underline}
.email{color:#aebed0;font-size:14px;word-break:break-all}
</style>
</head>

<body>

<div class="wrap">

<div class="logo">NovaFund</div>

<!-- LOGIN -->
<div id="auth" class="card">

<h2>Trader Account</h2>

<input id="email" type="email" placeholder="Email address">

<div class="passwordBox">
<input id="password" type="password" placeholder="Password">
<button class="eye" type="button" onclick="togglePassword()">👁️</button>
</div>

<button onclick="login()">Login</button>
<button class="secondary" onclick="signup()">Create Account</button>
<button class="link" onclick="forgotPassword()">Forgot Password?</button>
<button class="secondary" onclick="resend()">Resend Confirmation Email</button>

<div id="msg" class="msg"></div>

</div>


<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<span class="badge">TRADER ACCOUNT</span>

<h2>Trader Dashboard</h2>

<div class="email" id="userEmail"></div>

<p>Account: <b>$5,000 Challenge</b></p>

<div class="stat">
Balance
<div class="big" id="balance">$5,000</div>
</div>

<div class="stat">
Equity
<div class="big" id="equity">$5,000</div>
</div>

<div class="stat">
Profit
<div class="big green" id="profit">+$0</div>
</div>

<div class="stat">
Profit Target
<div class="big" id="target">8%</div>
</div>

<div class="stat">
Daily Loss
<div class="big" id="dailyLoss">0%</div>
</div>

<div class="stat">
Max Drawdown
<div class="big" id="drawdown">0%</div>
</div>

<div class="card">
<h3>Recent Trades</h3>
<p>XAUUSD — BUY — <span class="green">+$0</span></p>
<p>EURUSD — SELL — <span class="green">+$0</span></p>
<p>GBPUSD — BUY — <span class="red">$0</span></p>
</div>

<button onclick="logout()">Logout</button>

</div>

</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://fbtltoldqbegahrhrhzv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_gEWtMDiKIs03V-DeSMy0Kg_GyB73tt5";

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


const redirectURL =
"https://sumitchenurvar-cell.github.io/NOVAFUND/";


const msg =
document.getElementById("msg");


function message(text){
msg.innerText=text;
}


window.togglePassword=function(){

const password =
document.getElementById("password");

password.type =
password.type==="password"
? "text"
: "password";

};


window.signup=async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!email || !password){
message("Email aur password bharo.");
return;
}

if(password.length<6){
message("Password kam se kam 6 characters ka hona chahiye.");
return;
}

message("Account create ho raha hai...");

const {data,error} =
await supabase.auth.signUp({

email,
password,

options:{
emailRedirectTo:redirectURL
}

});

if(error){
message(error.message);
return;
}

if(data.session){

await loadTraderAccount(data.session.user);

showDashboard();

}else{

message(
"Account created! Email confirm karke Login karo."
);

}

};


window.login=async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!email || !password){
message("Email aur password bharo.");
return;
}

message("Login ho raha hai...");

const {data,error} =
await supabase.auth.signInWithPassword({

email,
password

});

if(error){
message(error.message);
return;
}

await loadTraderAccount(data.user);

showDashboard();

};


async function loadTraderAccount(user){

document.getElementById("userEmail").innerText =
user.email || "";

let {data,error} =
await supabase
.from("trader_accounts")
.select("*")
.eq("user_id",user.id)
.maybeSingle();


if(error){

console.error(error);

message(
"Account data load nahi ho saka: "
+ error.message
);

return;

}


if(!data){

const newAccount={

user_id:user.id,
account_size:5000,
balance:5000,
equity:5000,
profit:0,
profit_target:8,
daily_loss:0,
max_drawdown:0

};


const result =
await supabase
.from("trader_accounts")
.insert(newAccount)
.select()
.single();


if(result.error){

console.error(result.error);

message(
"Trader account create nahi ho saka: "
+ result.error.message
);

return;

}

data=result.data;

}


document.getElementById("balance").innerText =
"$"+Number(data.balance).toLocaleString();

document.getElementById("equity").innerText =
"$"+Number(data.equity).toLocaleString();

document.getElementById("profit").innerText =
(data.profit>=0?"+$":"-$")
+Math.abs(Number(data.profit)).toLocaleString();

document.getElementById("target").innerText =
Number(data.profit_target)+"%";

document.getElementById("dailyLoss").innerText =
Number(data.daily_loss)+"%";

document.getElementById("drawdown").innerText =
Number(data.max_drawdown)+"%";

}


window.resend=async function(){

const email =
document.getElementById("email").value.trim();

if(!email){
message("Pehle email enter karo.");
return;
}

message("Confirmation email bhej rahe hain...");

const {error} =
await supabase.auth.resend({

type:"signup",

email,

options:{
emailRedirectTo:redirectURL
}

});

if(error){
message(error.message);
}else{
message("Confirmation email bhej diya gaya hai.");
}

};


window.forgotPassword=async function(){

const email =
document.getElementById("email").value.trim();

if(!email){
message("Pehle email enter karo.");
return;
}

message("Password reset email bhej rahe hain...");

const {error} =
await supabase.auth.resetPasswordForEmail(

email,

{
redirectTo:redirectURL
}

);

if(error){
message(error.message);
}else{
message(
"Password reset email bhej diya gaya hai."
);
}

};


window.logout=async function(){

await supabase.auth.signOut();

document
.getElementById("dashboard")
.classList.add("hidden");

document
.getElementById("auth")
.classList.remove("hidden");

message("Logout successful.");

};


function showDashboard(){

document
.getElementById("auth")
.classList.add("hidden");

document
.getElementById("dashboard")
.classList.remove("hidden");

}


const {
data:{session}
} =
await supabase.auth.getSession();


if(session){

await loadTraderAccount(session.user);

showDashboard();

}


supabase.auth.onAuthStateChange(
async (event,session)=>{

if(session){

await loadTraderAccount(session.user);

showDashboard();

}

});

</script>

</body>
</html>
