<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaFund Trader Dashboard</title>
<style>
body{margin:0;background:#07111f;color:white;font-family:Arial;padding:20px}
.logo{font-size:28px;font-weight:bold;color:#46e6a5}
h1{font-size:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}
.card{background:#0d1a2b;border:1px solid #29415d;border-radius:15px;padding:20px}
.value{font-size:27px;font-weight:bold;margin-top:8px}
.green{color:#46e6a5}
button{padding:13px 20px;border:0;border-radius:9px;background:#46e6a5;font-weight:bold}
input{display:block;width:100%;padding:12px;margin:10px 0;box-sizing:border-box}
#dashboard{display:none}
</style>
</head>
<body>

<div class="logo">NovaFund</div>

<div id="login">
<h1>Trader Login</h1>
<p>Demo Trading Account</p>
<input placeholder="Email">
<input type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="dashboard">
<h1>Trader Dashboard</h1>
<p>Account: <b>$5,000 Challenge</b></p>

<div class="grid">
<div class="card">Balance<div class="value">$5,240</div></div>
<div class="card">Equity<div class="value">$5,215</div></div>
<div class="card">Profit<div class="value green">+$240</div></div>
<div class="card">Profit Target<div class="value">8%</div></div>
<div class="card">Daily Loss<div class="value">1.2%</div></div>
<div class="card">Max Drawdown<div class="value">2.1%</div></div>
</div>

<br>
<div class="card">
<h2>Recent Trades</h2>
<p>XAUUSD — BUY — <span class="green">+$85</span></p>
<p>EURUSD — SELL — <span class="green">+$55</span></p>
<p>GBPUSD — BUY — <span style="color:red">-$20</span></p>
</div>
</div>

<script>
function login(){
document.getElementById("login").style.display="none";
document.getElementById("dashboard").style.display="block";
}
</script>

</body>
</html>
